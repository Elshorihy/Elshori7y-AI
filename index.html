<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Elshori7y AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">E</div><div><strong>Elshori7y AI</strong><span>مساعدك الدراسي</span></div></div>
      <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
      <div class="side-section"><h3>المكتبة</h3><button class="side-btn" id="uploadBtn">📚 إضافة كتاب / PDF</button><input id="fileInput" type="file" accept="application/pdf,.pdf" hidden></div>
      <div class="side-section"><h3>الأدوات</h3><button class="side-btn">📝 إنشاء اختبار</button><button class="side-btn">📋 تلخيص درس</button><button class="side-btn">🧠 مراجعة سريعة</button></div>
      <div class="profile"><div class="avatar">E</div><div><b>Elshorihy</b><small>حسابك الشخصي</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="menu" id="menuBtn">☰</button><div><b>Elshori7y AI</b><span>مساعدك الشخصي</span></div><button class="icon-btn" id="themeBtn">☾</button></header>
      <section class="chat" id="chat">
        <div class="welcome" id="welcome"><div class="hero-logo">E</div><h1>أهلاً بيك في <span>Elshori7y AI</span> 👋</h1><p>مساعد دراسي شخصي تقدر تضيف له كتبك وتسأله عنها وتذاكر معاه.</p><div class="quick"><button data-prompt="اشرح لي الدرس بطريقة سهلة">اشرح لي درس 📖</button><button data-prompt="اعمل لي اختبار قصير">اختبرني 📝</button><button data-prompt="لخص لي أهم النقاط">لخص لي 📋</button></div></div>
      </section>
      <div class="composer-wrap"><div class="composer"><button id="attachBtn" title="إرفاق">＋</button><textarea id="prompt" rows="1" placeholder="اكتب سؤالك هنا..."></textarea><button class="send" id="sendBtn">➤</button></div><small>Elshori7y AI — سيتم توصيل محرك الذكاء الاصطناعي في الخطوة التالية.</small></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
