<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b1020"><title>Elshori7y AI</title><link rel="stylesheet" href="style.css?v=6"></head>
<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="logo">E</div><div><strong>Elshori7y AI</strong><span>مساعدك الدراسي</span></div></div>
<button class="new-chat" id="newChat">＋ محادثة جديدة</button>
<div class="side-section"><h3>المكتبة</h3><button class="side-btn" id="uploadBtn">📚 إضافة كتاب / PDF</button><input id="fileInput" type="file" accept="application/pdf,.pdf" hidden><select id="bookSelect" class="book-select"><option value="">📚 كل الكتب</option></select><div id="libraryStatus" class="library-status">لا توجد كتب مضافة</div></div>
<div class="side-section"><h3>مصدر المعرفة</h3><select id="modeSelect" class="book-select"><option value="auto">🔀 تلقائي — الكتب أولًا ثم العام</option><option value="books">📚 من كتبي فقط</option><option value="general">🧠 المساعد العام</option></select></div>
<div class="side-section"><h3>أدوات الدراسة</h3><button class="side-btn" data-prompt="اعمل لي اختبارًا قصيرًا من الكتاب المحدد، وضع الإجابات في النهاية.">📝 إنشاء اختبار</button><button class="side-btn" data-prompt="لخص الدرس أو الفصل الذي أحدده لك من الكتاب، واذكر أهم النقاط.">📋 تلخيص درس</button><button class="side-btn" data-prompt="اعمل لي مراجعة سريعة من أهم المعلومات الموجودة في الكتاب.">🧠 مراجعة سريعة</button><button class="side-btn" data-prompt="اشرح لي أصعب النقاط في الكتاب بطريقة بسيطة مع أمثلة.">🎓 شرح ومذاكرة</button></div>
<div class="profile"><div class="avatar">E</div><div><b>Elshorihy</b><small>حسابك الشخصي</small></div></div></aside>
<main class="main"><header class="topbar"><button class="menu" id="menuBtn">☰</button><div><b>Elshori7y AI</b><span>مساعدك الشخصي</span></div><button class="icon-btn" id="themeBtn">☾</button></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="hero-logo">E</div><h1>أهلاً بيك في <span>Elshori7y AI</span> 👋</h1><p>أضف كتبك، اختر مصدر المعرفة، ثم اسألني.</p><div class="quick"><button data-prompt="اشرح لي الدرس بطريقة سهلة">اشرح لي درس 📖</button><button data-prompt="اعمل لي اختبار قصير من الكتاب">اختبرني 📝</button><button data-prompt="لخص لي أهم النقاط من الكتاب">لخص لي 📋</button></div></div></section>
<div class="composer-wrap"><div class="composer"><button id="attachBtn" title="إرفاق">＋</button><textarea id="prompt" rows="1" placeholder="اكتب سؤالك هنا..."></textarea><button class="send" id="sendBtn">➤</button></div><small>Elshori7y AI — اختر: كتبك فقط، المساعد العام، أو الوضع التلقائي.</small></div></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="app.js?v=6"></script></body></html>
